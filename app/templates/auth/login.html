{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<form class="card auth-card" method="post">
  <a class="brand" href="{{ url_for('main.home') }}">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt=""><span>MamaTrack</span>
  </a>
  <h1>Sign in <small>Injira</small></h1>

  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button class="btn btn-primary btn-block">Sign in</button>
  <p class="muted">No account yet? <a href="{{ url_for('auth.signup') }}">Request one</a></p>
</form>
{% endblock %}
